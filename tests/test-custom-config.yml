name: Test commit lint with custom config
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a custom commitlint config file
        run: |
          cat > commitlint.config.js << 'EOF'
          module.exports = {
            rules: {
              'type-enum': [2, 'always', ['feat', 'fix', 'chore', 'docs']],
              'subject-empty': [2, 'never'],
            }
          };
          EOF

      - name: Make a conventional commit for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add commitlint.config.js
          git commit -m "feat: add commitlint config"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: conventional
        continue-on-error: true

      - name: Assert action ran with custom config
        env:
          REPORT: ${{ steps.action.outputs.report }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report: $REPORT"
          # The action should have run (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
