name: Test basic commit-lint usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          config: conventional

      - name: Assert action ran (output or known error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report: $REPORT"
          # The action may fail due to no real GitHub API access in act,
          # but it must not be skipped — it must have run (success or failure).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
