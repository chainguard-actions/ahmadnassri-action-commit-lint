name: Test basic usage - default config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          config: conventional
        continue-on-error: true

      - name: Assert report output exists
        env:
          REPORT: ${{ steps.action.outputs.report }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report: $REPORT"
          # Under workflow_dispatch there is no PR, so the action may succeed with
          # an empty/null report or may exit non-zero. Either way we verify the
          # step ran and the output variable is accessible (not an unset variable
          # from a step that never executed).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            # Acceptable: no PR context means nothing to lint
            echo "PASS: action exited non-zero (no PR context) - this is expected"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
