name: Test unsupported event (workflow_dispatch) exits gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: conventional
        continue-on-error: true

      - name: Assert action completed without failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should soft-exit (exit 0) on unsupported events like workflow_dispatch
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should not fail on unsupported event (workflow_dispatch)"
            exit 1
          fi
          echo "PASS: action exited gracefully on unsupported event"

      - name: Assert report output is empty (no commits processed)
        env:
          REPORT: ${{ steps.action.outputs.report }}
        run: |
          echo "report: $REPORT"
          # On workflow_dispatch, the action exits early before setting the report output
          # so the report should be empty/unset
          if [ -n "$REPORT" ]; then
            echo "INFO: report was set (unexpected but not a failure): $REPORT"
          else
            echo "PASS: report is empty as expected for unsupported event"
          fi
