name: Test pull request event context
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          config: conventional
        continue-on-error: true

      - name: Assert action completed in PR context
        env:
          REPORT: ${{ steps.action.outputs.report }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "report: $REPORT"
          # The action should complete (success or failure) without crashing the runner
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: action did not complete with a known outcome (got: $OUTCOME)"
            exit 1
          fi
          echo "PASS: action completed in PR context with outcome=$OUTCOME"
